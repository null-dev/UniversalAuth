// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '7.1.2' apply false
    id 'com.android.library' version '7.1.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.6.10' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

configure ([project(':faceunlock'), project(':universalauth-xposed')]) {
    afterEvaluate {
        android {
            defaultConfig {
                versionCode 19
                versionName "1.9-a16"
            }
            // Both APKs must share a key: the unlock permission is signature-level
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.exists()) {
                def ks = new Properties()
                ksFile.withInputStream { ks.load(it) }
                signingConfigs {
                    release {
                        storeFile rootProject.file(ks['storeFile'])
                        storePassword ks['storePassword']
                        keyAlias ks['keyAlias']
                        keyPassword ks['keyPassword']
                    }
                }
                buildTypes.release.signingConfig signingConfigs.release
            }
        }
    }
}